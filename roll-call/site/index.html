:root{
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#F6F7F9; --ink:#111827; --muted:#6B7280; --line:#E5E7EB;
  --accent:#2563EB; --accent-soft:#EAF1FE; --focus:#2563EB;
  --p:#22A55A; --p-strong:#1E8E4E; --p-soft:#E8F7EE; --a:#E5484D; --a-soft:#FDECEC; --u:#C9CED6;
  --on:#FFFFFF; --shadow:0 1px 2px rgba(17,24,39,.06),0 2px 8px rgba(17,24,39,.05);
  --g1:#2563EB; --g2:#DB2777; --g3:#D97706; --g4:#0EA5E9; --g5:#EA9A0B; --g6:#16A34A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116; --surface:#171B22; --surface-2:#1E232C; --ink:#E8EBF0; --muted:#9AA3AF; --line:#2A303A;
    --accent:#6EA0FF; --accent-soft:#1B2740; --focus:#8DB3FF;
    --p:#3CCB7F; --p-strong:#3CCB7F; --p-soft:#15291E; --a:#FF6B6F; --a-soft:#3A1A1B; --u:#4A5260;
    --on:#0E1116; --shadow:none;
    --g1:#6EA0FF; --g2:#F472B6; --g3:#F5A524; --g4:#38BDF8; --g5:#FBBF24; --g6:#4ADE80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#171B22; --surface-2:#1E232C; --ink:#E8EBF0; --muted:#9AA3AF; --line:#2A303A;
  --accent:#6EA0FF; --accent-soft:#1B2740; --focus:#8DB3FF;
  --p:#3CCB7F; --p-strong:#3CCB7F; --p-soft:#15291E; --a:#FF6B6F; --a-soft:#3A1A1B; --u:#4A5260;
  --on:#0E1116; --shadow:none;
  --g1:#6EA0FF; --g2:#F472B6; --g3:#F5A524; --g4:#38BDF8; --g5:#FBBF24; --g6:#4ADE80;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.page{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.pad{padding:0 16px}

/* Hero */
.hero{position:relative;height:260px;overflow:hidden;color:#fff;padding-top:env(safe-area-inset-top,0px)}
.hero svg.art{position:absolute;inset:0;width:100%;height:100%}
.hero .txt{position:absolute;left:18px;right:18px;bottom:44px}
.hero h1{margin:0;font-size:1.9rem;font-weight:800;letter-spacing:-.01em;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.hero p{margin:2px 0 0;font-size:1.02rem;opacity:.95;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.sync{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:700}
.sync i{width:8px;height:8px;border-radius:50%;background:#4ADE80;display:inline-block}
.sync.off i{background:#FBBF24}
.sync.err i{background:#F87171}
.sheet-top{position:relative;margin-top:-26px;background:var(--bg);border-radius:22px 22px 0 0;padding-top:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.today{display:flex;align-items:center;gap:14px;padding:12px 14px;width:100%;text-align:left;min-height:64px}
.today .ic{width:40px;height:40px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.today small{display:block;color:var(--muted);font-size:.8rem}
.today strong{display:block;font-size:1.02rem}
.today .route{font-size:.82rem;color:var(--muted)}
.chev{margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);flex:none}

h2.sec{margin:22px 0 2px;font-size:1.25rem;font-weight:800}
p.sec-sub{margin:0 0 12px;color:var(--muted);font-size:.9rem}

.groups{display:grid;gap:10px}
.grp{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px 10px 12px;text-align:left;border-left:4px solid var(--gc)}
.grp.mine{background:var(--accent-soft);border-color:var(--accent);border-left-color:var(--gc)}
.gi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:1.45rem;background:color-mix(in srgb,var(--gc) 14%,transparent)}
.gmain{min-width:0;flex:1}
.gname{display:block;font-weight:800;font-size:1rem}
.gsub{display:block;color:var(--muted);font-size:.86rem}
.gstat{font-size:.82rem;font-weight:700;white-space:nowrap}
.gstat.done{color:var(--p-strong)} .gstat.abs{color:var(--a)} .gstat.todo{color:var(--muted)}
.tag{display:inline-block;margin-left:6px;font-size:.7rem;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;vertical-align:1px}
.g1{--gc:var(--g1)} .g2{--gc:var(--g2)} .g3{--gc:var(--g3)} .g4{--gc:var(--g4)} .g5{--gc:var(--g5)} .g6{--gc:var(--g6)}

.tile{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 14px;text-align:left}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2);font-size:1.3rem}
.tile b{display:block;font-size:1rem}
.tile span.s{display:block;color:var(--muted);font-size:.85rem}
.air{display:grid;gap:10px}
.air .tile .ic{background:var(--accent-soft);color:var(--accent)}
.divider{height:1px;background:var(--line);margin:26px 0 0}

/* Top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;display:flex;align-items:center;gap:6px}
.back{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;flex:none}
.back:active{background:var(--surface-2)}
.top h1{margin:0;font-size:1.2rem;font-weight:800;flex:1;min-width:0}
.head{display:flex;align-items:center;gap:12px;padding:4px 16px 12px}
.head .gi{width:48px;height:48px;font-size:1.7rem}
.head h1{margin:0;font-size:1.35rem;font-weight:800;line-height:1.2}
.head p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.switch{margin-left:auto;min-height:36px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 12px;font-size:.82rem;font-weight:700;color:var(--accent);flex:none}
.when{margin:0 16px 12px;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:700}

.prog{padding:0 16px 12px}
.prog .row1{display:flex;justify-content:space-between;font-size:.9rem;font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--p);border-radius:99px;transition:width .25s}
.search{margin:0 16px 12px;position:relative}
.search input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px 0 40px;font-size:1rem}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.quick{display:flex;justify-content:flex-end;padding:0 16px 8px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;font-size:.9rem;min-height:40px;padding:0 4px}

.list{margin:0 16px;padding:0;list-style:none}
.list li.sub{margin:14px 0 6px;font-size:.85rem;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:8px}
.list li.sub .dot{width:10px;height:10px;border-radius:3px;background:var(--gc)}
.st{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 6px 6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.st[data-s="A"]{background:var(--a-soft);border-color:color-mix(in srgb,var(--a) 40%,var(--line))}
.st .n{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:.78rem;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.st .nm{flex:1;min-width:0;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.mk{width:44px;height:44px;border:0;background:none;padding:0;display:grid;place-items:center;flex:none;border-radius:50%}
.mk span{width:34px;height:34px;border-radius:50%;border:2px solid var(--u);display:grid;place-items:center;color:transparent;transition:background .12s,border-color .12s}
.mk.P[aria-pressed="true"] span{background:var(--p);border-color:var(--p);color:#fff}
.mk.A[aria-pressed="true"] span{background:var(--a);border-color:var(--a);color:#fff}
.mk.P span{color:color-mix(in srgb,var(--p) 55%,transparent)}
.mk.A span{color:color-mix(in srgb,var(--a) 55%,transparent)}
.empty-note{margin:16px;color:var(--muted);text-align:center}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.dock .in{max-width:528px;margin:0 auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;border:0;background:var(--p);color:#fff;font-weight:800;font-size:1.05rem}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.saved{display:flex;align-items:center;gap:14px;background:var(--p-soft);border:1px solid color-mix(in srgb,var(--p) 35%,transparent);border-radius:14px;padding:12px 16px}
.saved .ok{width:36px;height:36px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;flex:none}
.saved b{display:block;color:var(--p-strong);font-size:1.02rem}
.saved span{font-size:.88rem;color:var(--muted)}

/* Summary */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:64px;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:.82rem;line-height:1.2;padding:6px 8px}
.chip b{display:block;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.box{margin:0 16px 12px;padding:14px}
.donut{display:flex;align-items:center;gap:20px}
.donut svg{flex:none}
.legend{flex:1;display:grid;gap:8px;font-size:.92rem}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.teamhead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:0 0 12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.travel .ic{background:var(--accent-soft);color:var(--accent)}

.acc{margin:0 16px 12px;overflow:hidden}
.acc h3{margin:0;display:flex;align-items:center;gap:10px;padding:14px;font-size:1rem}
.acc.abs h3{color:var(--a);background:var(--a-soft)}
.acc ul{list-style:none;margin:0;padding:0 10px 10px}
.acc li{display:flex;align-items:center;gap:10px;padding:10px 6px;border-top:1px solid var(--line)}
.acc li:first-child{border-top:0}
.acc li .who{margin-left:auto;font-size:.8rem;color:var(--muted);text-align:right}
.acc .none{padding:12px 14px 16px;color:var(--muted);text-align:center;font-size:.92rem}

/* Master sheet */
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 16px 12px}
.totals div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.totals b{display:block;font-size:1.4rem}
.totals span{font-size:.8rem;color:var(--muted)}
.tbl{margin:0 16px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:separate;border-spacing:0;font-size:.86rem;min-width:100%}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-size:.72rem;color:var(--muted);font-weight:700;vertical-align:bottom}
th.nm,td.nm{position:sticky;left:0;background:var(--surface);text-align:left;white-space:normal;min-width:150px;max-width:180px;border-right:1px solid var(--line);font-weight:600;z-index:1}
tr.gh td{background:var(--surface-2);text-align:left;font-weight:800;font-size:.82rem}
tr.gh td span{position:sticky;left:8px}
td.c{font-weight:800;min-width:30px}
td.c.P{color:var(--p-strong)} td.c.A{color:var(--a);background:var(--a-soft)} td.c.U{color:var(--u)}
td.t{font-weight:800;font-variant-numeric:tabular-nums}
td.t.bad{color:var(--a)}
.note{margin:10px 16px;color:var(--muted);font-size:.85rem}

/* Unlock */
.lock{margin:0 16px;padding:18px}
.lock h2{margin:0 0 6px;font-size:1.2rem}
.lock p{margin:0 0 12px;color:var(--muted)}
.lock input{width:100%;min-height:50px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:0 14px;font-size:1.1rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.msg{margin:0 0 12px;font-size:.92rem}
.msg.bad{color:var(--a)}
.warn{margin:0 16px 12px;padding:10px 12px;border-radius:12px;background:var(--a-soft);border:1px solid var(--a);font-size:.92rem}

/* Bottom sheet */
#modal{position:fixed;inset:0;z-index:30}
#modal[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(10,14,20,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:5px;border-radius:9px;background:var(--u);margin:0 auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-h h2{margin:0;font-size:1.2rem}
.x{width:44px;height:44px;border:0;background:none;border-radius:12px;font-size:1.4rem;color:var(--muted)}
.tick{margin-left:auto;color:var(--accent);font-weight:800}

#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:.92rem;max-width:calc(100% - 32px)}
#toast[hidden]{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

  /* ---------- Unlock ---------- */
  function b64bytes(b64) { const bin = atob(b64); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
  const hex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
  async function unlock(fromLink) {
    const inp = document.getElementById('tripCode');
    const raw = fromLink || (inp ? inp.value : '');
    const code = String(raw).toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!code) { S.unlockMsg = 'Type the trip code first.'; render(); return; }
    if (!(window.crypto && crypto.subtle)) { S.unlockMsg = 'This browser cannot unlock the list. Open the link in Chrome or Safari.'; render(); return; }
    S.unlockBusy = true; S.unlockMsg = 'Unlocking… this takes a few seconds.'; render();
    const again = document.getElementById('tripCode'); if (again) again.value = raw;
    try {
      const L = LOCKED_LIST;
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveBits']);
      const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64bytes(L.salt), iterations: L.iter, hash: 'SHA-256' }, base, 512));
      const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-GCM', false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64bytes(L.iv) }, key, b64bytes(L.data));
      const list = JSON.parse(new TextDecoder().decode(plain));
      if (!list || !Array.isArray(list.teams) || !list.teams.length) throw new Error('empty');
      SECRET = { sync: hex(bits.slice(32, 64)), salt: L.salt };
      try { localStorage.setItem(SECRET_KEY, JSON.stringify(SECRET)); } catch (e) {}
      const keep = D && D.salt === L.salt;
      D = { app: 'bhutan-roll-call', version: 2, salt: L.salt, teams: list.teams, marks: keep ? D.marks : {}, outbox: keep ? D.outbox : {}, lastSrv: keep ? D.lastSrv : 0, myTeam: keep ? D.myTeam : null };
      S.unlockBusy = false; S.unlockMsg = null; S.badKey = false;
      save(); history.replaceState(null, '', location.pathname + location.search + '#/'); render(); toast('Unlocked. Marks now sync with every teacher.');
      syncNow();
    } catch (e) {
      S.unlockBusy = false; S.unlockMsg = 'That code did not work. Check it and try again.'; render();
      const i = document.getElementById('tripCode'); if (i) { i.value = raw; i.focus(); }
    }
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act],[data-go],[data-mk]');
    if (!el) return;
    if (el.dataset.mk) {
      const r = route(), sid = el.dataset.sid, cur = getMark(r.a, sid);
      setMark(r.a, sid, cur === el.dataset.mk ? null : el.dataset.mk);
      S.savedFlash = null;
      render();
      return;
    }
    if (el.dataset.pick) closeSheet();
    if (el.dataset.go) {
      const m = el.dataset.go.match(/^#\/mark\/[^/]+\/(t[^/]+)$/);
      if (m && !D.myTeam) { D.myTeam = m[1]; save(); }
      if (!el.dataset.pick) closeSheet();
      S.q = ''; S.savedFlash = null;
      go(el.dataset.go);
      window.scrollTo(0, 0);
      return;
    }
    const act = el.dataset.act;
    if (act === 'unlock') unlock();
    else if (act === 'close') closeSheet();
    else if (act === 'switch') openSwitch();
    else if (act === 'allP') {
      const r = route();
      const rows = r.b === 'all' ? allStudents().map(x => x.s) : (teamById(r.b) || { students: [] }).students;
      for (const s of rows) if (!getMark(r.a, s.id)) setMark(r.a, s.id, 'P');
      render();
    } else if (act === 'saveAtt') {
      const r = route();
      const rows = r.b === 'all' ? allStudents().map(x => x.s) : (teamById(r.b) || { students: [] }).students;
      const s = stats(r.a, rows);
      if (s.U) { toast(s.U + (s.U === 1 ? ' student is' : ' students are') + ' not marked yet.'); return; }
      S.savedFlash = r.a + '/' + r.b;
      render();
      syncNow();
      toast(navigator.onLine ? 'Saved and shared with all teachers.' : 'Saved on this phone. It will share when you are back online.');
    }
  });
  document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; render(); } });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !modal.hidden) closeSheet();
    if (e.key === 'Enter' && e.target.id === 'tripCode') unlock();
  });
  window.addEventListener('hashchange', () => { S.q = ''; closeSheet(); render(); });
  window.addEventListener('online', () => syncNow());
  window.addEventListener('offline', () => { S.syncErr = 'offline'; renderStatus(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); });
  window.addEventListener('storage', e => { if (e.key === KEY) { load(); render(); } });

  load();
  if (D && !SECRET) D = null;
  // A shared link can carry the trip code (…/#code=BT26-XXXX-XXXX) so teachers never type it.
  // The part after # never leaves the phone; it is removed from the address bar once used.
  const linkCode = (location.hash.match(/^#code=([A-Za-z0-9-]+)/) || [])[1];
  if (linkCode) {
    if (D) history.replaceState(null, '', location.pathname + location.search + '#/');
    else setTimeout(() => unlock(linkCode), 0);
  }
